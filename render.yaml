services:
  - type: web
    name: lazysloth-cleaner
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com https://fonts.googleapis.com https://fonts.gstatic.com blob: data:; connect-src 'self' http://localhost:5001 http://127.0.0.1:5001 https://*.onrender.com; img-src 'self' data: blob: https://placehold.co https://images.unsplash.com;"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
